<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC CRUSADER - Retro Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030014;
            color: #fff;
            overflow: hidden;
        }
        .pixel-border {
            box-shadow: 
                0 -4px 0 0 #3b82f6,
                0 4px 0 0 #3b82f6,
                -4px 0 0 0 #3b82f6,
                4px 0 0 0 #3b82f6;
        }
        .pixel-border-gold {
            box-shadow: 
                0 -4px 0 0 #eab308,
                0 4px 0 0 #eab308,
                -4px 0 0 0 #eab308,
                4px 0 0 0 #eab308;
        }        .arcade-btn {
            transition: all 0.1s ease;
            text-shadow: 2px 2px #000;
        }.arcade-btn:active {
            transform: translateY(3px);
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Virtual Touch D-pad styles */
        .touch-pad {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 select-none bg-slate-950">

    <div class="relative w-full max-w-lg aspect-[3/4] max-h-[90vh] flex flex-col items-center justify-between border-4 border-cyan-500/50 rounded-xl overflow-hidden shadow-[0_0_30px_rgba(6,182,212,0.3)] bg-slate-900">
        
        <!-- Header HUD -->
        <div class="w-full bg-slate-950/80 p-3 flex justify-between items-center z-10 border-b-2 border-cyan-500/30 text-xs sm:text-sm">
            <div class="flex items-center space-x-2">
                <span class="text-cyan-400">SCORE:</span>
                <span id="scoreDisplay" class="text-yellow-400">000000</span>
            </div>
            <div class="flex items-center space-x-3">
                <button id="soundToggleBtn" class="text-xs bg-slate-800 hover:bg-slate-700 p-1.5 rounded text-cyan-300 border border-cyan-500/40">
                    🔊 SOUND
                </button>
                <div class="flex items-center space-x-1">
                    <span class="text-red-500 text-sm">♥</span>
                    <span id="livesDisplay" class="text-red-400">x3</span>
                </div>
            </div>
        </div>

        <!-- Canvas Game Screen -->
        <div class="relative w-full h-full flex items-center justify-center overflow-hidden bg-black">
            <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

            <!-- START SCREEN OVERLAY -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-20">
                <h1 class="text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 mb-4 animate-pulse leading-snug">COSMIC<br>CRUSADER
                </h1>
                <p class="text-[10px] sm:text-xs text-cyan-200/80 mb-6 leading-relaxed max-w-xs">
                    DEFEND THE GALAXY!<br>
                    DESKTOP: ARROWS / WASD + SPACE<br>
                    MOBILE: ON-SCREEN TOUCH CONTROLS
                </p>
                <button id="startBtn" class="arcade-btn bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-3 rounded text-xs sm:text-sm shadow-lg mb-4 cursor-pointer pixel-border">
                    START GAME
                </button>
                <div class="text-[10px] text-yellow-400 mt-2">
                    HIGH SCORE: <span id="startHighScore">0</span>
                </div>
            </div>

            <!-- GAME OVER OVERLAY -->
            <div id="gameOverOverlay" class="hidden absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center z-20">
                <h2 class="text-2xl sm:text-3xl text-red-500 mb-2 font-bold animate-bounce">GAME OVER</h2>
<div class="my-4 text-xs sm:text-sm space-y-2">
                    <p class="text-slate-300">FINAL SCORE: <span id="finalScore" class="text-cyan-400">0</span></p>
                    <p class="text-slate-300">HIGH SCORE: <span id="finalHighScore" class="text-yellow-400">0</span></p>
                    <p id="newRecordTag" class="hidden text-yellow-300 text-[10px] animate-pulse">★ NEW RECORD! ★</p>
                </div>

                <div class="flex flex-col gap-3 w-full max-w-xs mt-4">
                    <button id="restartBtn" class="arcade-btn bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-3 rounded text-xs pixel-border cursor-pointer">
                        PLAY AGAIN
                    </button>
                    
                    <button id="fbShareBtn" class="arcade-btn bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-3 rounded text-xs flex items-center justify-center gap-2 cursor-pointer border border-blue-400">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        SHARE ON FACEBOOK

                    </button>
                </div>
            </div>
        </div>

        <!-- Touch Controls Bar (Mobile Visible) -->
        <div id="mobileControls" class="w-full bg-slate-950/90 p-3 flex justify-between items-center border-t-2 border-cyan-500/30 z-10 select-none">
            <!-- Left/Right Joystick Pad -->
            <div class="flex gap-2">
                <button id="btnLeft" class="touch-pad w-14 h-14 active:bg-cyan-500/40 text-cyan-300 text-xl font-bold flex items-center justify-center rounded-xl">◄</button>
                <button id="btnRight" class="touch-pad w-14 h-14 active:bg-cyan-500/40 text-cyan-300 text-xl font-bold flex items-center justify-center rounded-xl">►</button>
            </div>
            <!-- Action / Fire Button -->
            <button id="btnFire" class="touch-pad w-16 h-14 active:bg-red-500/50 bg-red-600/30 border-red-500/50 text-red-200 text-xs font-bold flex items-center justify-center rounded-xl">
                FIRE
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio Synthesizer ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playShoot() {
                if (this.muted || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
