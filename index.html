<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC CRUSADER - Retro Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030014;
            color: #fff;
            overflow: hidden;
        }
        .pixel-border {
            box-shadow: 
                0 -4px 0 0 #3b82f6,
                0 4px 0 0 #3b82f6,
                -4px 0 0 0 #3b82f6,
                4px 0 0 0 #3b82f6;
        }
        .pixel-border-gold {
            box-shadow: 
                0 -4px 0 0 #eab308,
                0 4px 0 0 #eab308,
                -4px 0 0 0 #eab308,
                4px 0 0 0 #eab308;
        }        .arcade-btn {
            transition: all 0.1s ease;
            text-shadow: 2px 2px #000;
        }.arcade-btn:active {
            transform: translateY(3px);
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Virtual Touch D-pad styles */
        .touch-pad {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 select-none bg-slate-950">

    <div class="relative w-full max-w-lg aspect-[3/4] max-h-[90vh] flex flex-col items-center justify-between border-4 border-cyan-500/50 rounded-xl overflow-hidden shadow-[0_0_30px_rgba(6,182,212,0.3)] bg-slate-900">
        
        <!-- Header HUD -->
        <div class="w-full bg-slate-950/80 p-3 flex justify-between items-center z-10 border-b-2 border-cyan-500/30 text-xs sm:text-sm">
            <div class="flex items-center space-x-2">
                <span class="text-cyan-400">SCORE:</span>
                <span id="scoreDisplay" class="text-yellow-400">000000</span>
            </div>
            <div class="flex items-center space-x-3">
                <button id="soundToggleBtn" class="text-xs bg-slate-800 hover:bg-slate-700 p-1.5 rounded text-cyan-300 border border-cyan-500/40">
                    🔊 SOUND
                </button>
                <div class="flex items-center space-x-1">
                    <span class="text-red-500 text-sm">♥</span>
                    <span id="livesDisplay" class="text-red-400">x3</span>
                </div>
            </div>
        </div>

        <!-- Canvas Game Screen -->
        <div class="relative w-full h-full flex items-center justify-center overflow-hidden bg-black">
            <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

            <!-- START SCREEN OVERLAY -->
            <div id="startOverlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-6 text-center z-20">
                <h1 class="text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 mb-4 animate-pulse leading-snug">
