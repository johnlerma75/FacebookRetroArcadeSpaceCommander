<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COSMIC CRUSADER - Retro Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #030014;
            color: #fff;
            overflow: hidden;
        }
        .pixel-border {
            box-shadow: 
                0 -4px 0 0 #3b82f6,
                0 4px 0 0 #3b82f6,
                -4px 0 0 0 #3b82f6,
                4px 0 0 0 #3b82f6;
        }
        .pixel-border-gold {
            box-shadow: 
                0 -4px 0 0 #eab308,
                0 4px 0 0 #eab308,
                -4px 0 0 0 #eab308,
                4px 0 0 0 #eab308;
        }
        .arcade-btn {
            transition: all 0.1s ease;
            text-shadow: 2px 2px #000;
        }
        .arcade-btn:active {
            transform: translateY(3px);
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Virtual Touch D-pad styles */
        .touch-pad {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 select-none bg-slate-950">

    <div class="relative w-full max-w-lg aspect-[3/4] max-h-[90vh] flex flex-col items-center justify-between border-4 border-cyan-500/50 rounded-xl overflow-hidden shadow-[0_0_30px_rgba(6,182,212,0.3)] bg-slate-900">
        
        <!-- Header HUD -->
        <div class="w-full bg-slate-950/80 p-3 flex justify-between items-center z-10 border-b-2 border-cyan-500/30 text-xs sm:text-sm">
            <div class="flex items-center space-x-2">
